<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* set the theme before first paint so there is no colour flash */
  document.documentElement.dataset.theme =
    localStorage.getItem('pref-theme') ||
    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  /* the boot bar runs once per browsing session, not on every visit */
  try { if (sessionStorage.getItem('booted')) document.documentElement.dataset.booted = '1'; } catch (e) {}
</script>
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} / {{ site.Title }}{{ end }}</title>
{{- with or .Description site.Params.description }}
<meta name="description" content="{{ . }}">
{{- end }}
<link rel="canonical" href="{{ .Permalink }}">
{{- range .AlternativeOutputFormats }}
<link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ site.Title }}">
{{- end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/terminal.css" | relURL }}">
